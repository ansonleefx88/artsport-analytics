<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adtomatic CRM · 预约名单</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
body{background:#F5F5F5}
[hidden]{display:none !important}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 12px}
.bar h1{margin:0;font-size:24px;font-weight:900}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{min-height:44px;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.tbtn.dark{background:var(--ink);color:#FFFFFF}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat-c{background:#FFFFFF;border-radius:10px;padding:10px 12px}
.stat-c div:first-child{font-size:13px;color:var(--mute);font-weight:700}
.stat-c div:last-child{font-family:Poppins,sans-serif;font-size:24px;font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters button{min-height:40px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.filters input{flex:1 1 200px;min-height:42px;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;font-family:inherit;font-size:15px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:48px}
.lead{background:#FFFFFF;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;border-left:6px solid #CCCCCC}
.lead[data-s="new"]{border-left-color:var(--red)}
.lead[data-s="contacted"]{border-left-color:#F59E0B}
.lead[data-s="confirmed"]{border-left-color:#2563EB}
.lead[data-s="showed"]{border-left-color:#7C3AED}
.lead[data-s="won"]{border-left-color:#16A34A}
.lead[data-s="no_show"],.lead[data-s="lost"]{border-left-color:#9CA3AF}
.lead .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lead .nm{font-size:19px;font-weight:900}
.lead .meta{font-size:13px;color:var(--mute)}
.lead .row2{font-size:15px;line-height:1.6}
.lead .row2 b{color:var(--mute);font-weight:700;margin-right:4px}
.lead .when{font-weight:900;color:var(--red)}
.lead select,.lead textarea{font-family:inherit;font-size:15px;border:2px solid #DDDDDD;border-radius:8px;padding:8px 10px;width:100%}
.lead select{min-height:42px;font-weight:700}
.lead textarea{min-height:60px;resize:vertical}
.lead .acts{display:flex;gap:8px;flex-wrap:wrap}
.wa-l{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:8px;background:#16A34A;color:#FFFFFF !important;font-weight:700;text-decoration:none;font-size:14px}
.saved{font-size:12px;color:#16A34A;font-weight:700;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.login{max-width:380px;margin:12vh auto;background:#FFFFFF;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login input{min-height:52px;padding:12px;border:2px solid var(--ink);border-radius:8px;font-family:inherit;font-size:17px}
.msg{color:var(--red);font-weight:700;margin:0}
.empty{background:#FFFFFF;border-radius:12px;padding:32px;text-align:center;color:var(--mute);grid-column:1/-1}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.list{grid-template-columns:minmax(0,1fr)}}
.tabs-top{display:flex;gap:4px;margin-top:16px;border-bottom:2px solid #DDDDDD}
.tabs-top button{min-height:46px;padding:8px 18px;border:none;background:none;font-family:inherit;font-size:17px;font-weight:900;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs-top button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tsel{min-height:44px;padding:6px 10px;border:2px solid var(--ink);border-radius:8px;background:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700}
.adbox{background:#F5F5F5;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6}
.adbox b{color:var(--ink)}
.adbox .id{color:var(--mute);font-family:Poppins,monospace;font-size:12px}
.an-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.an-filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--mute)}
.an-filters select{min-height:40px;max-width:240px;padding:4px 8px;border:2px solid #CCCCCC;border-radius:8px;font-family:inherit;font-size:14px;background:#FFFFFF}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#FFFFFF;border-radius:10px;padding:12px}
.kpi div:first-child{font-size:13px;color:var(--mute);font-weight:700}
.kpi div:nth-child(2){font-family:Poppins,sans-serif;font-size:26px;font-weight:800}
.kpi.hl div:nth-child(2){color:var(--red)}
.card-a{background:#FFFFFF;border-radius:12px;padding:16px;margin-bottom:12px}
.card-a h2{margin:0 0 4px;font-size:18px;font-weight:900}
.card-a .hint{margin:0 0 12px;font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 120px;gap:10px;align-items:center;padding:4px 0}
.brow .lb{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:22px;background:#F1F1F1;border-radius:4px;position:relative}
.brow .fill{height:100%;background:#111111;border-radius:0 4px 4px 0;min-width:2px}
.brow .fill.red{background:#E11D1D}
.brow .vl{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.brow .vl small{color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mute);font-weight:700;border-bottom:2px solid #EEEEEE;padding:6px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid #F1F1F1;padding:6px 8px;vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.n{text-align:right}
.tbl tr:hover td{background:#FAFAFA}
.tscroll{overflow-x:auto}
.good{color:#15803D;font-weight:700}
.empty-a{background:#FFFFFF;border-radius:12px;padding:28px;color:var(--mute);line-height:1.8}
.empty-a code{background:#F1F1F1;padding:2px 6px;border-radius:4px;font-size:13px;word-break:break-all}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.brow{grid-template-columns:minmax(0,110px) minmax(0,1fr) 92px}}
</style>
</head>
<body>

<header class="topbar">
<div class="wrap">
<img src="assets/logo.png" alt="Adtomatic">
<p><span>CRM</span> · 免费 Zoom 预约名单</p>
</div>
</header>

<main class="wrap">
<form class="login" id="login">
<b style="font-size:20px">输入 CRM 密码</b>
<input type="password" id="pw" autocomplete="current-password" placeholder="CRM_PASSWORD">
<button class="btn" type="submit" style="max-width:none;min-height:52px;font-size:18px">进入</button>
<p class="msg" id="login-msg"></p>
</form>

<div id="app" hidden>
<nav class="tabs-top" role="tablist">
<button type="button" role="tab" id="tab-leads" aria-selected="true">预约名单</button>
<button type="button" role="tab" id="tab-an" aria-selected="false">Analytics</button>
</nav>
<div id="pane-leads">
<div class="bar">
<h1>预约名单</h1>
<div class="tools">
<button class="tbtn" id="refresh" type="button">刷新</button>
<button class="tbtn" id="csv" type="button">导出 CSV</button>
<button class="tbtn dark" id="logout" type="button">登出</button>
</div>
</div>
<div class="stats" id="stats"></div>
<div class="filters" id="filters"><input type="search" id="q" placeholder="搜索名字 / 电话 / 行业 / 广告"></div>
<p class="msg" id="app-msg"></p>
<div class="list" id="list"></div>
</div>

<div id="pane-an" hidden>
<div class="bar">
<h1>Analytics</h1>
<div class="tools">
<select id="an-site" class="tsel" aria-label="网站"></select>
<select id="an-range" class="tsel" aria-label="时间范围"><option value="today">今天</option><option value="yesterday">昨天</option><option value="7d" selected>最近 7 天</option><option value="30d">最近 30 天</option></select>
<button class="tbtn" id="an-refresh" type="button">刷新</button>
<button class="tbtn" id="an-exp-s" type="button" title="一个 session 一行：来源、Ad、看了什么、点了几次、有没有转化">导出 Sessions CSV</button>
<button class="tbtn dark" id="an-exp-e" type="button" title="最原始的数据：每一个点击、滚动、视频、表单事件一行">导出 Raw Events CSV</button>
</div>
</div>
<div class="an-filters" id="an-filters"></div>
<p class="msg" id="an-msg"></p>
<div id="an-body"></div>
</div>
</div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = [['new', '新 Lead'], ['contacted', '已联络'], ['confirmed', '已确认'], ['showed', '已出席'], ['no_show', 'No-show'], ['won', '成交'], ['lost', '不合适']];
  var LABEL = {}; S.forEach(function (x) { LABEL[x[0]] = x[1]; });
  var key = '', leads = [], filter = 'all';
  try { key = sessionStorage.getItem('adt_crm') || ''; } catch (e) {}

  function api(method, body) {
    return fetch('/api/leads', { method: method, headers: { 'x-crm-key': key, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .then(function (r) { if (r.status === 401) throw new Error('auth'); return r.json(); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function waNum(p) { var d = String(p || '').replace(/\D/g, ''); if (d.charAt(0) === '0') d = '6' + d; return d; }
  function fmt(iso) { try { return new Date(iso).toLocaleString('zh-CN', { timeZone: 'Asia/Kuala_Lumpur', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } }
  function when(l) { return l.custom_time ? '自己写：' + l.custom_time : (l.date_label ? l.date_label + ' ' + l.time : '-'); }
  function industry(l) { return l.industry === '其他' && l.industry_other ? '其他：' + l.industry_other : (l.industry || '-'); }

  function load() {
    $('app-msg').textContent = '载入中…';
    return api('GET').then(function (j) {
      if (!j.ok) throw new Error(j.error || 'error');
      leads = j.leads || []; $('app-msg').textContent = '';
      $('login').hidden = true; $('app').hidden = false; render();
    }).catch(function (e) {
      if (e.message === 'auth') { key = ''; try { sessionStorage.removeItem('adt_crm'); } catch (x) {} $('login').hidden = false; $('app').hidden = true; $('login-msg').textContent = '密码不对'; }
      else $('app-msg').textContent = '载入失败：' + e.message;
    });
  }

  function render() {
    // stats
    var st = $('stats'); st.innerHTML = '';
    var count = function (s) { return leads.filter(function (l) { return l.status === s; }).length; };
    [['全部', leads.length], ['新 Lead', count('new')], ['已确认', count('confirmed')], ['已出席', count('showed')], ['No-show', count('no_show')], ['成交', count('won')]].forEach(function (x) {
      var c = el('div', 'stat-c'); c.appendChild(el('div', '', x[0])); c.appendChild(el('div', '', x[1])); st.appendChild(c);
    });
    // filters
    var f = $('filters');
    f.querySelectorAll('button').forEach(function (b) { b.remove(); });
    [['all', '全部']].concat(S).forEach(function (x) {
      var b = el('button', '', x[1]); b.type = 'button'; b.setAttribute('aria-pressed', filter === x[0] ? 'true' : 'false');
      b.addEventListener('click', function () { filter = x[0]; render(); });
      f.insertBefore(b, $('q'));
    });
    // list
    var q = $('q').value.trim().toLowerCase();
    var rows = leads.filter(function (l) {
      if (filter !== 'all' && l.status !== filter) return false;
      if (!q) return true;
      var a = l.ad || {}; return [l.name, l.phone, l.industry, l.industry_other, l.challenge, a.campaign, a.adset, a.ad, a.ad_id].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    var list = $('list'); list.innerHTML = '';
    if (!rows.length) { list.appendChild(el('div', 'empty', leads.length ? '没有符合的 lead' : '还没有预约。客户在预约页提交后会出现在这里。')); return; }
    rows.forEach(function (l) {
      var c = el('div', 'lead'); c.dataset.s = l.status;
      var top = el('div', 'top'); var left = el('div');
      left.appendChild(el('div', 'nm', l.name || '-'));
      left.appendChild(el('div', 'meta', '提交：' + fmt(l.created_at) + ' · #' + l.id));
      top.appendChild(left);
      var sel = el('select'); sel.style.width = 'auto';
      S.forEach(function (x) { var o = el('option', '', x[1]); o.value = x[0]; if (l.status === x[0]) o.selected = true; sel.appendChild(o); });
      top.appendChild(sel); c.appendChild(top);
      var r1 = el('div', 'row2'); r1.appendChild(el('b', '', '时间')); r1.appendChild(el('span', 'when', when(l))); c.appendChild(r1);
      var r2 = el('div', 'row2'); r2.appendChild(el('b', '', '电话')); r2.appendChild(el('span', '', l.phone || '-')); c.appendChild(r2);
      var r3 = el('div', 'row2'); r3.appendChild(el('b', '', '行业')); r3.appendChild(el('span', '', industry(l))); c.appendChild(r3);
      if (l.challenge) { var r4 = el('div', 'row2'); r4.appendChild(el('b', '', 'CPL / 挑战')); r4.appendChild(el('span', '', l.challenge)); c.appendChild(r4); }
      var ad = l.ad || {};
      if (ad.campaign || ad.adset || ad.ad || ad.ad_id || ad.source) {
        var ab = el('div', 'adbox');
        ab.appendChild(el('div', '', '来源：' + (ad.source || '-') + (ad.placement ? ' · ' + ad.placement : '')));
        [['Campaign', ad.campaign, ad.campaign_id], ['Ad set', ad.adset, ad.adset_id], ['Ad', ad.ad, ad.ad_id]].forEach(function (x) {
          if (!x[1] && !x[2]) return;
          var row = el('div'); row.appendChild(el('b', '', x[0] + '：')); row.appendChild(el('span', '', x[1] || '-'));
          if (x[2]) row.appendChild(el('span', 'id', '  ID ' + x[2]));
          ab.appendChild(row);
        });
        c.appendChild(ab);
      } else if (l.utm) { c.appendChild(el('div', 'meta', '来源：' + l.utm)); }
      else { c.appendChild(el('div', 'meta', '来源：没有广告参数（直接打开 / 自然流量）')); }
      var notes = el('textarea'); notes.placeholder = '备注（例如：已打电话，周三再跟）'; notes.value = l.notes || ''; c.appendChild(notes);
      var acts = el('div', 'acts');
      var wa = el('a', 'wa-l', 'WhatsApp 他');
      wa.href = 'https://wa.me/' + waNum(l.phone) + '?text=' + encodeURIComponent('Hi ' + (l.name || '') + '，我是 Adtomatic 的同事，收到你预约的免费 45 分钟 Zoom 咨询（' + when(l) + '）。想跟你确认时间 🙏');
      wa.target = '_blank'; wa.rel = 'noopener'; acts.appendChild(wa);
      var ok = el('span', 'saved', '已保存 ✓'); acts.appendChild(ok); c.appendChild(acts);
      function save(patch) {
        api('PATCH', Object.assign({ id: l.id }, patch)).then(function (j) {
          if (j.ok) { Object.assign(l, j.lead); c.dataset.s = l.status; ok.classList.add('on'); setTimeout(function () { ok.classList.remove('on'); }, 1500); }
        }).catch(function () { alert('保存失败，请刷新再试'); });
      }
      sel.addEventListener('change', function () { save({ status: sel.value }); });
      notes.addEventListener('blur', function () { if (notes.value !== (l.notes || '')) save({ notes: notes.value }); });
      list.appendChild(c);
    });
  }

  function csv() {
    var head = ['编号', '提交时间', '名字', '电话', '行业', '时间', 'CPL / 挑战', '状态', '备注', '来源', 'Campaign', 'Campaign ID', 'Ad set', 'Ad set ID', 'Ad', 'Ad ID', 'Placement'];
    var esc = function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    var lines = [head.map(esc).join(',')].concat(leads.map(function (l) {
      var a = l.ad || {};
      return [l.id, fmt(l.created_at), l.name, l.phone, industry(l), when(l), l.challenge, LABEL[l.status] || l.status, l.notes, a.source || l.utm || '', a.campaign, a.campaign_id, a.adset, a.adset_id, a.ad, a.ad_id, a.placement].map(esc).join(',');
    }));
    var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'adtomatic-leads-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }


  // ================= Analytics =================
  var anF = {}, anSite = '', anLoaded = false;
  function tab(which) {
    var an = which === 'an';
    $('tab-leads').setAttribute('aria-selected', an ? 'false' : 'true'); $('tab-an').setAttribute('aria-selected', an ? 'true' : 'false');
    $('pane-leads').hidden = an; $('pane-an').hidden = !an;
    if (an && !anLoaded) loadAn();
  }
  $('tab-leads').addEventListener('click', function () { tab('leads'); });
  $('tab-an').addEventListener('click', function () { tab('an'); });
  $('an-refresh').addEventListener('click', loadAn);
  function exportAn(kind, btn) {
    var qs = new URLSearchParams({ range: $('an-range').value, export: kind });
    if (anSite) qs.set('site', anSite);
    var old = btn.textContent; btn.textContent = '导出中…'; btn.disabled = true;
    fetch('/api/analytics?' + qs.toString(), { headers: { 'x-crm-key': key }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); var cd = r.headers.get('content-disposition') || ''; return r.blob().then(function (b) { return [b, (cd.match(/filename="([^"]+)"/) || [])[1]]; }); })
      .then(function (x) { var a = document.createElement('a'); a.href = URL.createObjectURL(x[0]); a.download = x[1] || (kind + '.csv'); a.click(); })
      .catch(function (e) { alert('导出失败：' + e.message); })
      .then(function () { btn.textContent = old; btn.disabled = false; });
  }
  $('an-exp-s').addEventListener('click', function () { exportAn('sessions', $('an-exp-s')); });
  $('an-exp-e').addEventListener('click', function () { exportAn('events', $('an-exp-e')); });
  $('an-range').addEventListener('change', loadAn);
  $('an-site').addEventListener('change', function () { anSite = $('an-site').value; anF = {}; loadAn(); });

  function num(n) { return (n || 0).toLocaleString('en-US'); }
  function secs(s) { s = s || 0; return s >= 60 ? Math.floor(s / 60) + '分' + (s % 60) + '秒' : s + '秒'; }
  function card(title, hint) { var c = el('div', 'card-a'); c.appendChild(el('h2', '', title)); if (hint) c.appendChild(el('p', 'hint', hint)); return c; }
  function bars(rows, opt) {   // rows: [{label, value, max, text, red, tip}]
    var wrap = el('div');
    rows.forEach(function (r) {
      var row = el('div', 'brow'); row.title = r.tip || (r.label + '：' + r.text);
      var lb = el('div', 'lb', r.label); lb.title = r.label; row.appendChild(lb);
      var tr = el('div', 'track'); var f = el('div', 'fill' + (r.red ? ' red' : '')); f.style.width = (r.max ? Math.max(0.5, r.value / r.max * 100) : 0) + '%'; tr.appendChild(f); row.appendChild(tr);
      var vl = el('div', 'vl'); vl.textContent = r.text; row.appendChild(vl);
      wrap.appendChild(row);
    });
    return wrap;
  }
  function table(cols, rows) {   // cols: [label, fn, isNum]
    var box = el('div', 'tscroll'), t = el('table', 'tbl'), thead = el('thead'), hr = el('tr');
    cols.forEach(function (c) { var th = el('th', c[2] ? 'n' : '', c[0]); hr.appendChild(th); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) { var tr = el('tr'); cols.forEach(function (c) { var v = c[1](r); var td = el('td', c[2] ? 'n' : ''); if (v instanceof Node) td.appendChild(v); else td.textContent = v == null ? '' : v; tr.appendChild(td); }); tb.appendChild(tr); });
    t.appendChild(tb); box.appendChild(t); return box;
  }
  function none(text) { return el('p', 'hint', text || '这段时间还没有数据'); }

  function loadAn() {
    anLoaded = true;
    var qs = new URLSearchParams({ range: $('an-range').value });
    if (anSite) qs.set('site', anSite);
    Object.keys(anF).forEach(function (k) { if (anF[k]) qs.set(k, anF[k]); });
    $('an-msg').textContent = '计算中…（第一次看较长的时间范围会慢一点）';
    fetch('/api/analytics?' + qs.toString(), { headers: { 'x-crm-key': key }, cache: 'no-store' })
      .then(function (r) { if (r.status === 401) throw new Error('auth'); return r.json(); })
      .then(function (j) { $('an-msg').textContent = j.ok ? '' : '载入失败：' + (j.error || ''); if (j.ok) renderAn(j); })
      .catch(function (e) { $('an-msg').textContent = e.message === 'auth' ? '密码过期，请重新登入' : '载入失败：' + e.message; });
  }

  function renderAn(j) {
    var sel = $('an-site'); sel.innerHTML = '';
    (j.sites || []).forEach(function (x) { var o = el('option', '', x); o.value = x; if (x === j.site) o.selected = true; sel.appendChild(o); });
    anSite = j.site;
    var body = $('an-body'); body.innerHTML = '';
    if (j.disabled) {
      var e = el('div', 'empty-a');
      e.innerHTML = '<b>Analytics 还没开启。</b><br>自己的服务器：在 <code>.env</code> 加 <code>ANALYTICS_ENABLED=1</code>，重启。<br>Vercel：Environment Variables 加 <code>ANALYTICS_ENABLED</code> = <code>1</code>，Redeploy（Hobby 写入上限低，建议先升级 Pro）。';
      body.appendChild(e); $('an-filters').innerHTML = ''; return;
    }
    // filters
    var fbox = $('an-filters'); fbox.innerHTML = '';
    [['source', '来源'], ['campaign', 'Campaign'], ['adset', 'Ad set'], ['ad', 'Ad'], ['dev', '设备']].forEach(function (x) {
      var opts = (j.options && j.options[x[0]]) || []; if (!opts.length && !anF[x[0]]) return;
      var lab = el('label', '', x[1]); var s2 = el('select'); var o0 = el('option', '', '全部'); o0.value = ''; s2.appendChild(o0);
      opts.forEach(function (v) { var o = el('option', '', v); o.value = v; if (anF[x[0]] === v) o.selected = true; s2.appendChild(o); });
      s2.addEventListener('change', function () { anF[x[0]] = s2.value; loadAn(); });
      lab.appendChild(s2); fbox.appendChild(lab);
    });

    var T = j.totals;
    if (!T.sessions) { body.appendChild(el('div', 'empty-a', j.from + ' 到 ' + j.to + ' 还没有访问数据。网站有人来之后，这里会自动出现。')); return; }

    // KPIs
    var k = el('div', 'kpis');
    [['访问 (Sessions)', num(T.sessions)], ['访客', num(T.visitors)], [j.goal_label, num(T.goals), 1], ['转化率', T.cvr + '%', 1], ['平均停留', secs(T.avg_eng)], ['跳出率', T.bounce + '%']].forEach(function (x) {
      var d = el('div', 'kpi' + (x[2] ? ' hl' : '')); d.appendChild(el('div', '', x[0])); d.appendChild(el('div', '', x[1])); k.appendChild(d);
    });
    body.appendChild(k);

    // Funnel
    var fc = card('转化漏斗', '每一步有多少个 session 做到，括号是跟上一步比。看哪一步掉最多，就先修那一步。');
    var f0 = j.funnel.length ? j.funnel[0].sessions : 0;
    fc.appendChild(bars(j.funnel.map(function (f, i) {
      return { label: f.label, value: f.sessions, max: f0, red: i === j.funnel.length - 1, text: num(f.sessions) + '  ' + f.of_first + '%', tip: f.label + '：' + num(f.sessions) + ' 个 session，占第一步 ' + f.of_first + '%，上一步留下 ' + f.of_prev + '%' };
    })));
    fc.appendChild(table([['步骤', function (r) { return r.label; }], ['Sessions', function (r) { return num(r.sessions); }, 1], ['占第一步', function (r) { return r.of_first + '%'; }, 1], ['上一步留下', function (r) { return r.of_prev + '%'; }, 1]], j.funnel));
    body.appendChild(fc);

    // Ads
    var ac = card('广告表现（按 Ad）', '要在 Meta 广告的「网址参数」加上 utm 和 ID，这里才分得出是哪一个 Ad。设定方法见 README。');
    if (j.ads.length) {
      var amax = Math.max.apply(null, j.ads.map(function (a) { return a.cvr; }).concat([0]));
      ac.appendChild(table([
        ['Campaign', function (r) { return r.campaign; }], ['Ad set', function (r) { return r.adset; }], ['Ad', function (r) { return r.ad + (r.ad_id ? ' (' + r.ad_id + ')' : ''); }],
        ['Sessions', function (r) { return num(r.sessions); }, 1], ['看 VSL', function (r) { return num(r.vsl); }, 1], ['开始填表', function (r) { return num(r.form_start); }, 1],
        [j.goal_label, function (r) { return num(r.goals); }, 1], ['转化率', function (r) { var s2 = el('span', r.cvr === amax && r.goals ? 'good' : '', r.cvr + '%'); return s2; }, 1]
      ], j.ads));
    } else ac.appendChild(none('这段时间没有带广告参数的访问。'));
    body.appendChild(ac);

    // Sources / campaigns / ad sets / devices
    var g2 = el('div', 'grid2');
    function grp(title, rows) {
      var c = card(title); if (!rows.length) { c.appendChild(none()); return c; }
      c.appendChild(table([['', function (r) { return r.key; }], ['Sessions', function (r) { return num(r.sessions); }, 1], [j.goal_label, function (r) { return num(r.goals); }, 1], ['转化率', function (r) { return r.cvr + '%'; }, 1], ['平均停留', function (r) { return secs(r.avg_eng); }, 1]], rows));
      return c;
    }
    g2.appendChild(grp('来源', j.by_source)); g2.appendChild(grp('Campaign', j.by_campaign));
    g2.appendChild(grp('Ad set', j.by_adset)); g2.appendChild(grp('设备', j.by_device));
    body.appendChild(g2);

    // Daily
    var dc = card('每日趋势');
    var dmax = Math.max.apply(null, j.daily.map(function (d) { return d.sessions; }).concat([1]));
    dc.appendChild(bars(j.daily.map(function (d) { return { label: d.date.slice(5), value: d.sessions, max: dmax, text: num(d.sessions) + ' · ' + d.goals + ' 转化', tip: d.date + '：' + d.sessions + ' sessions，' + d.goals + ' 个' + j.goal_label }; })));
    body.appendChild(dc);

    // Scroll + video
    var g3 = el('div', 'grid2');
    var sc = card('滚动深度（' + j.main_page + '）', '多少人滑到页面的 25% / 50% / 75% / 90% / 底部');
    sc.appendChild(bars(j.scroll.map(function (r) { return { label: '滑到 ' + r.depth + '%', value: r.pct, max: 100, text: r.pct + '%  (' + num(r.sessions) + ')' }; })));
    g3.appendChild(sc);
    var vc = card('视频观看', '按播放的人里面，看到 25% / 50% / 75% / 看完的比例');
    if (j.videos.length) j.videos.forEach(function (v) {
      vc.appendChild(el('p', 'hint', v.video + ' · ' + num(v.play) + ' 次播放'));
      vc.appendChild(bars([['播放', v.play], ['25%', v.p25], ['50%', v.p50], ['75%', v.p75], ['看完', v.p100]].map(function (x) { return { label: x[0], value: x[1], max: v.play, text: num(x[1]) + '  ' + (v.play ? Math.round(x[1] / v.play * 100) : 0) + '%' }; })));
    }); else vc.appendChild(none('还没有人播放视频'));
    g3.appendChild(vc);
    body.appendChild(g3);

    // Sections
    var secC = card('每一段内容：看到的人 + 停留时间', '看到 = 那一段有 35% 出现在屏幕上。由上往下看，就知道人在哪一段开始流失、在哪一段停最久。');
    if (j.sections.length) secC.appendChild(table([['页面', function (r) { return r.page; }], ['段落', function (r) { return r.section; }], ['看到的 Sessions', function (r) { return num(r.sessions); }, 1], ['占该页访问', function (r) { return r.pct + '%'; }, 1], ['平均停留', function (r) { return secs(r.avg_secs); }, 1]], j.sections));
    else secC.appendChild(none());
    body.appendChild(secC);

    // Clicks
    var cc = card('他们点了什么', '每个按钮 / 链接 / 图片被多少个 session 点过，在哪一段。占比 = 该页访问里面有多少 % 的人点。');
    if (j.clicks.length) cc.appendChild(table([['页面', function (r) { return r.page; }], ['段落', function (r) { return r.section; }], ['点了什么', function (r) { return r.label; }], ['去哪里', function (r) { return r.to; }], ['Sessions', function (r) { return num(r.sessions); }, 1], ['总点击', function (r) { return num(r.clicks); }, 1], ['占比', function (r) { return r.pct + '%'; }, 1]], j.clicks));
    else cc.appendChild(none());
    body.appendChild(cc);

    // Form fields
    var fc2 = card('表单：每一格的使用情况', '「最后停在这里」= 填到这一格就离开、没有提交的人数。数字高的那一格，就是最劝退的问题。');
    if (j.fields.length) fc2.appendChild(table([['表单 | 栏位', function (r) { return r.field; }], ['点进去', function (r) { return num(r.focus); }, 1], ['有填', function (r) { return num(r.done); }, 1], ['最后停在这里', function (r) { return num(r.last_drop); }, 1]], j.fields));
    else fc2.appendChild(none('还没有人碰表单'));
    body.appendChild(fc2);

    // Pages + events + entry
    var g4 = el('div', 'grid2');
    var pc = card('页面'); pc.appendChild(j.pages.length ? table([['页面', function (r) { return r.path; }], ['Sessions', function (r) { return num(r.sessions); }, 1], ['占比', function (r) { return r.pct + '%'; }, 1]], j.pages) : none()); g4.appendChild(pc);
    var ec = card('重要动作（自定义事件）', 'booking_submit = 提交预约、whatsapp_confirm = 按 WhatsApp 确认、calendar_add = 加 Calendar、hs_form_submit = HubSpot 表单提交');
    ec.appendChild(j.events.length ? table([['事件', function (r) { return r.name; }], ['Sessions', function (r) { return num(r.sessions); }, 1]], j.events) : none()); g4.appendChild(ec);
    body.appendChild(g4);
    body.appendChild(el('p', 'hint', '时间范围：' + j.from + ' 到 ' + j.to + '（马来西亚时间）· 网站：' + j.site));
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault(); key = $('pw').value; $('login-msg').textContent = '';
    try { sessionStorage.setItem('adt_crm', key); } catch (x) {}
    load();
  });
  $('refresh').addEventListener('click', load);
  $('csv').addEventListener('click', csv);
  $('logout').addEventListener('click', function () { key = ''; try { sessionStorage.removeItem('adt_crm'); } catch (x) {} location.reload(); });
  $('q').addEventListener('input', render);
  if (key) load();
})();
</script>
</body>
</html>
